name: Charter-wise MECE Funnel Sync v2

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync Metabase to Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          METABASE_URL:             ${{ secrets.METABASE_URL }}
          METABASE_USERNAME:        ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD:        ${{ secrets.METABASE_PASSWORD }}
          GOOGLE_SHEET_ID:          ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python sync_to_sheets.py
